services:
  - type: web
    name: bustrack
    runtime: python

    plan: free

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.12

      - key: DATABASE_URL
        fromDatabase:
          name: bustrack-db
          property: connectionString

      - key: APP_ENV
        value: production

      - key: JWT_ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30

      - key: JWT_SECRET_KEY
        sync: false

      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

databases:
  - name: bustrack-db
    plan: free
