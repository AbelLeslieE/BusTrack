services:
  - type: web
    name: bustrack
    runtime: python

    plan: free

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.12

      - key: DATABASE_URL
        sync: false

      - key: APP_ENV
        value: production

      - key: JWT_ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30

      - key: AIROTRACK_POLL_INTERVAL_SECONDS
        value: 20

      - key: AIROTRACK_CATCHUP_MAX_REQUESTS
        value: 8

      - key: GPS_PROVIDER_HISTORY_RETENTION_MINUTES
        value: 1440

      - key: JWT_SECRET_KEY
        # Render creates and persists a cryptographically strong 256-bit key
        # for new Blueprint deployments. Never replace this key after users
        # have logged in, or their active sessions will be invalidated.
        generateValue: true

      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
