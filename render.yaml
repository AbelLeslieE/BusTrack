services:
  - type: web
    name: bustrack
    runtime: python

    plan: free

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.12

      - key: DATABASE_URL
        fromDatabase:
          name: bustrack-db
          property: connectionString

databases:
  - name: bustrack-db
    plan: free