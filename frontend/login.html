<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BusTrack | Fleet Command Center</title>

    <link rel="icon" type="image/png" href="/static/assets/images/logo.png?v=20261015logo2">

    <link rel="stylesheet" href="/static/common/login.css?v=20261017fix1">
</head>

<body>

    <main class="login-container">

        <!-- ==========================================
             FLOATING LOGIN CARD
        =========================================== -->

        <section class="login-card">

            <div class="glass-overlay"></div>

            <!-- ======================================
                 LOGO
            ======================================= -->

            <div class="login-logo">

                <img src="/static/assets/images/logo.png?v=20261015logo2" alt="BusTrack logo">

                <h1>

                    Bus<span>Track</span>

                </h1>

                <p>

                    Fleet Command Center

                </p>

            </div>

            <!-- ======================================
                 HEADER
            ======================================= -->

            <div class="login-header">

                <h2>

                    Welcome Back

                </h2>

                <p>

                    Sign in to continue.

                </p>

            </div>

            <!-- ======================================
                 LOGIN FORM
            ======================================= -->

            <form id="login-form">

                <div class="form-group">

                    <label for="username">

                        Username or student email

                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="Enter your username or student email"
                        autocomplete="username"
                        required>

                </div>

                <div class="form-group">

                    <label for="password">

                        Password

                    </label>

                    <div class="password-wrapper">

                        <input
                            id="password"
                            name="password"
                            type="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button
                            id="toggle-password"
                            type="button">

                            Show

                        </button>

                    </div>

                </div>

                <div class="login-options">
                    <p class="login-help">Forgot your password? Contact your transport administrator for a reset.</p>
                </div>

                <p id="login-message"
                   class="login-message">

                </p>

                <button
                    class="login-button"
                    type="submit">

                    Sign In

                </button>

            </form>

            <div class="auth-divider" aria-hidden="true"><span>New student</span></div>

            <a class="google-signup-button" href="/api/auth/google/signup">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.91h5.38a4.6 4.6 0 0 1-2 3.02v2.54h3.24c1.9-1.75 2.98-4.33 2.98-7.4Z"/>
                    <path fill="#34A853" d="M12 22c2.7 0 4.98-.9 6.63-2.43l-3.24-2.54c-.9.6-2.05.96-3.39.96-2.61 0-4.82-1.76-5.61-4.13H3.04v2.62A10 10 0 0 0 12 22Z"/>
                    <path fill="#FBBC05" d="M6.39 13.86A6.01 6.01 0 0 1 6.08 12c0-.65.11-1.28.31-1.86V7.52H3.04A10 10 0 0 0 2 12c0 1.61.39 3.14 1.04 4.48l3.35-2.62Z"/>
                    <path fill="#EA4335" d="M12 6.01c1.47 0 2.79.51 3.83 1.5l2.87-2.88A9.65 9.65 0 0 0 12 2a10 10 0 0 0-8.96 5.52l3.35 2.62C7.18 7.77 9.39 6.01 12 6.01Z"/>
                </svg>
                Sign up with Google
            </a>
            <p class="google-signup-help">Use your verified <strong>@sahardaya.ac.in</strong> account.</p>

        </section>

    </main>

    <script type="module"
            src="/static/common/auth.js?v=20261102google1"></script>

    

</body>

</html>
