<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BusTrack | Fleet Command Center</title>

    <link rel="stylesheet" href="/static/common/login.css">
</head>

<body>

    <main class="login-container">

        <!-- ==========================================
             FLOATING LOGIN CARD
        =========================================== -->

        <section class="login-card">

            <div class="glass-overlay"></div>

            <!-- ======================================
                 LOGO
            ======================================= -->

            <div class="login-logo">

                <img src="/static/assets/images/logo.png">

                <h1>

                    Bus<span>Track</span>

                </h1>

                <p>

                    Fleet Command Center

                </p>

            </div>

            <!-- ======================================
                 HEADER
            ======================================= -->

            <div class="login-header">

                <h2>

                    Welcome Back

                </h2>

                <p>

                    Sign in to continue.

                </p>

            </div>

            <!-- ======================================
                 LOGIN FORM
            ======================================= -->

            <form id="login-form">

                <div class="form-group">

                    <label for="username">

                        Username

                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required>

                </div>

                <div class="form-group">

                    <label for="password">

                        Password

                    </label>

                    <div class="password-wrapper">

                        <input
                            id="password"
                            name="password"
                            type="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button
                            id="toggle-password"
                            type="button">

                            Show

                        </button>

                    </div>

                </div>

                <div class="login-options">

                    <label class="remember">

                        <input type="checkbox">

                        Remember me

                    </label>

                    <a href="#">

                        Forgot Password?

                    </a>

                </div>

                <p id="login-message"
                   class="login-message">

                </p>

                <button
                    class="login-button"
                    type="submit">

                    Sign In

                </button>

            </form>

        </section>

    </main>

    <script type="module"
            src="/static/common/auth.js"></script>

    <script>

    // Password visibility

    const togglePassword =
        document.getElementById("toggle-password");

    const password =
        document.getElementById("password");

    togglePassword.addEventListener("click",()=>{

        const visible =
            password.type==="text";

        password.type =
            visible ? "password":"text";

        togglePassword.textContent =
            visible ? "Show":"Hide";

    });

    </script>

</body>

</html>
