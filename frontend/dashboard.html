<!doctype html>
<!-- Bus Tracker SPA host. TODO: Add the shared application layout when feature requirements are defined. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bus Tracker</title>
    <link rel="stylesheet" href="/static/common/theme.css">
    <link rel="stylesheet" href="/static/common/layout.css">
    <link rel="stylesheet" href="/static/common/sidebar.css">
    <link rel="stylesheet" href="/static/common/topbar.css">
    <!-- Font Awesome Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        
    />
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <!-- Global UI Components -->
    <link rel="stylesheet" href="/static/common/modal.css">
    <link rel="stylesheet" href="/static/common/dropdown.css">
    <link rel="stylesheet" href="/static/common/responsive.css">
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <main id="app" class="app-root" aria-live="polite"></main>
    <script type="module">
      import { requireAuthenticatedSession } from "/static/common/auth.js";
      import { loadModule } from "/static/common/router.js";
      

      const profile = await requireAuthenticatedSession();

      if (!profile) {
          throw new Error("No authenticated session.");
      }

      let moduleName;

      switch (profile.role) {

          case "Administrator":

              moduleName = window.location.hash.slice(1) || "dashboard";

              break;

          case "Driver":

              // Force the driver hash before anything loads
              if (!window.location.hash) {

                  window.location.hash = "driverDashboard";

              }

              moduleName = "driverDashboard";

              break;

          default:

              moduleName = "dashboard";

      }

      loadModule(moduleName);

  </script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </body>
</html>
