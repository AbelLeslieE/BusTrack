<!doctype html>
<!-- Bus Tracker SPA host. TODO: Add the shared application layout when feature requirements are defined. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bus Tracker</title>
    <link rel="stylesheet" href="/static/common/theme.css">
    <link rel="stylesheet" href="/static/common/layout.css">
    <link rel="stylesheet" href="/static/common/sidebar.css">
    <link rel="stylesheet" href="/static/common/topbar.css">
    <!-- Font Awesome Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        
    />
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <!-- Global UI Components -->
    <link rel="stylesheet" href="/static/common/modal.css">
    <link rel="stylesheet" href="/static/common/dropdown.css">
    <link rel="stylesheet" href="/static/common/responsive.css">
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <main id="app" class="app-root" aria-live="polite"></main>
    <!-- ==========================================================
        LEAFLET MAP ENGINE
    ========================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <!-- ==========================================================
        BUSTRACK APPLICATION
    ========================================================== -->

    <script type="module">

        import {
            requireAuthenticatedSession
        } from "/static/common/auth.js";

        import {
            loadModule
        } from "/static/common/router.js";


        const profile =
            await requireAuthenticatedSession();


        if (!profile) {

            throw new Error(
                "No authenticated session."
            );

        }


        let moduleName;


        // ==========================================================
        // ROLE-BASED MODULE SELECTION
        // ==========================================================

        // Normalize the role returned by the backend.
        //
        // Backend currently uses:
        //   admin
        //   driver
        //   student
        //
        // This also accepts the older frontend names:
        //   Administrator
        //   Driver
        //   Student

        const role = String(profile.role || "")
            .trim()
            .toLowerCase();

        switch (role) {

            // ------------------------------------------------------
            // ADMINISTRATOR
            // ------------------------------------------------------

            case "admin":
            case "administrator":

                moduleName =
                    window.location.hash.slice(1) ||
                    "dashboard";

                break;


            // ------------------------------------------------------
            // DRIVER
            // ------------------------------------------------------

            case "driver":

                if (!window.location.hash) {

                    window.location.hash =
                        "driverDashboard";

                }

                moduleName =
                    "driverDashboard";

                break;


            // ------------------------------------------------------
            // STUDENT
            // ------------------------------------------------------

            case "student":

                if (!window.location.hash) {

                    window.location.hash =
                        "studentDashboard";

                }

                moduleName =
                    "studentDashboard";

                break;


            // ------------------------------------------------------
            // UNKNOWN ROLE
            // ------------------------------------------------------

            default:

                console.error(
                    "BusTrack: Unsupported role:",
                    profile.role
                );

                throw new Error(
                    `Unsupported user role: ${profile.role}`
                );

        }

        loadModule(moduleName);

    </script>
  </body>
</html>
