<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102a48">
  <title>BusTrack is offline</title>
  <style>
    *{box-sizing:border-box}body{min-height:100vh;min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,sans-serif;color:#eef7ff;background:radial-gradient(circle at 50% 10%,#153b62,#06111f 65%)}
    main{width:min(100%,460px);padding:34px;border:1px solid rgba(111,219,255,.3);border-radius:28px;background:rgba(9,28,50,.78);box-shadow:0 30px 80px rgba(0,0,0,.38);backdrop-filter:blur(18px);text-align:center}
    img{width:112px;height:112px;border-radius:24px}h1{margin:22px 0 10px;font-size:clamp(28px,8vw,42px)}p{margin:0 0 24px;color:#b8c9df;line-height:1.6}a{display:inline-block;padding:13px 24px;border:1px solid #62dcff;border-radius:13px;background:#176091;color:white;font:700 16px system-ui;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <img src="/static/assets/images/pwa-icon-192.png" alt="BusTrack">
    <h1>You’re offline</h1>
    <p>BusTrack needs a connection to verify your account and load current bus, route, and GPS data. Your tracer samples already saved on this phone remain safe.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
